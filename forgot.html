<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Восстановление пароля</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="logo">🚀 RocketApp</div>
    <h1 class="title">Сброс пароля</h1>
    <p class="subtitle">Введите email, и мы отправим ссылку для восстановления</p>

    <form class="form" action="#" method="post">
      <label class="label" for="email">Email</label>
      <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required>

      <button class="button" type="submit">Отправить ссылку</button>
    </form>

    <p class="footer">Вспомнили пароль? <a class="link" href="index.html">Вернуться ко входу</a></p>
  </main>
</body>
</html>
