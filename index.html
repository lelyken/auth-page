<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="logo">🚀 RocketApp</div>
    <h1 class="title">Вход</h1>
    <p class="subtitle">Рады видеть вас снова!</p>

    <form class="form" action="#" method="post">
      <label class="label" for="email">Email</label>
      <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required>

      <label class="label" for="password">Пароль</label>
      <input class="input" type="password" id="password" name="password" minlength="8" required>

      <div class="row">
        <label class="check"><input type="checkbox"> Запомнить меня</label>
        <a class="link" href="forgot.html">Забыли пароль?</a>
      </div>

      <button class="button" type="submit">Войти</button>
    </form>

    <div class="divider">или</div>

    <div class="social-buttons">
      <button class="social-btn" type="button">Войти через Google</button>
      <button class="social-btn" type="button">Войти через VK</button>
    </div>

    <p class="footer">Нет аккаунта? <a class="link" href="register.html">Зарегистрироваться</a></p>
  </main>
</body>
</html>
