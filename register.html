<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="logo">🚀 RocketApp</div>
    <h1 class="title">Регистрация</h1>
    <p class="subtitle">Создайте аккаунт за минуту</p>

    <form class="form" action="#" method="post">
      <label class="label" for="name">Имя</label>
      <input class="input" type="text" id="name" name="name" placeholder="Иван" required>

      <label class="label" for="email">Email</label>
      <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required>

      <label class="label" for="password">Пароль</label>
      <input class="input" type="password" id="password" name="password" minlength="8" required>

      <label class="label" for="password2">Повторите пароль</label>
      <input class="input" type="password" id="password2" name="password2" minlength="8" required>

      <label class="check"><input type="checkbox" required> Принимаю правила сайта</label>

      <button class="button" type="submit">Создать аккаунт</button>
    </form>

    <div class="divider">или</div>

    <div class="social-buttons">
      <button class="social-btn" type="button">Войти через Google</button>
      <button class="social-btn" type="button">Войти через VK</button>
    </div>

    <p class="footer">Уже есть аккаунт? <a class="link" href="index.html">Войти</a></p>
  </main>
</body>
</html>
  <div class="cursor-glow"></div>
  <script>
    const glow = document.querySelector('.cursor-glow');
    const card = document.querySelector('.card');

    document.addEventListener('mousemove', (e) => {
      // Двигаем неоновое пятно за курсором
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';

      // Координаты курсора внутри карточки для внутреннего блика
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      card.style.setProperty('--mouse-x', `${x}px`);
      card.style.setProperty('--mouse-y', `${y}px`);

      // Лёгкий 3D-наклон карточки
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const rotateX = ((e.clientY - centerY) / centerY) * -4;
      const rotateY = ((e.clientX - centerX) / centerX) * 4;
      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    // Возвращаем карточку ровно, если мышь ушла с экрана
    document.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
    });
  </script>
</body>
